name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup OCR toolkit (tesseract + langs + Apple Vision venv + rapidocr)
        run: python3 scripts/mac-ocr setup

      - name: Smoke test
        run: bash tests/smoke.sh

      - name: Verify deployed command via PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          which vision-ocr
          vision-ocr --version
